_schema-version: 3.3.0
ID: Po_workflow
description: A simple CAP project.
version: 1.0.0
modules:
  - name: Po_workflow-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: Po_workflow-auth
      - name: Po_workflow-db
      - name: Po_workflow-connectivity
      - name: Po_workflow-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: Po_workflow-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: Po_workflow-db
    parameters:
      buildpack: nodejs_buildpack
  - name: Po_workflow
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: Po_workflow-auth
      - name: Po_workflow-destination
      - name: Po_workflow-html5-runtime
      - name: Po_workflow-portal
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: Po_workflow-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: Po_workflow-auth
      - name: srv-api
      - name: Po_workflow-html5-repo-host
        parameters:
          config:
            HTML5Runtime_enabled: true
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - project1.zip
          name: project1
          target-path: app/
  - name: Po_workflow-portal-deployer
    type: com.sap.application.content
    path: app/portal
    requires:
      - name: Po_workflow-portal
        parameters:
          content-target: true
          service-key:
            config:
              content-endpoint: developer
            name: Po_workflow-portal-key
      - name: Po_workflow-auth
      - name: Po_workflow-html5-repo-host
      - name: Po_workflow-app-deployer
    deployed-after:
      - Po_workflow-app-deployer
  - name: project1
    type: html5
    path: app/project1
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: Po_workflow-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: Po_workflow-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api
  - name: Po_workflow-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Po_workflow-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: Po_workflow-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
  - name: Po_workflow-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: Po_workflow-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: Po_workflow-portal
    type: org.cloudfoundry.managed-service
    parameters:
      service: portal
      service-plan: standard
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
